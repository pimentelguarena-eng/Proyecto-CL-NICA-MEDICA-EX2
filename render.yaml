services:
  - type: web
    name: clinica-medical-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Pega aquí la Connection String de Supabase (Pooler Transaction port 6543)
      - key: SUPABASE_URL
        sync: false # https://[tu-id-proyecto].supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false # URL de tu Cloudflare Pages (ej: https://clinica-medical.pages.dev)
